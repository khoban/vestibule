<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2a3f86"/>
      <stop offset="0.55" stop-color="#2a1a5e"/>
      <stop offset="1" stop-color="#080515"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0.8" stop-color="#5a8cff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#5a8cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="star">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.35" stop-color="#bcd0ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#6e96ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- outward glow, disc, rim -->
  <circle cx="32" cy="32" r="32" fill="url(#halo)"/>
  <circle cx="32" cy="32" r="26" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#b4c8ff" stroke-width="1.5"/>
  <!-- constellation lines -->
  <path d="M20 24 L31 30 L42 21 M31 30 L37 42 L24 40" fill="none" stroke="#a8c0ff" stroke-opacity="0.55" stroke-width="1"/>
  <!-- stars -->
  <circle cx="20" cy="24" r="4" fill="url(#star)"/>
  <circle cx="31" cy="30" r="6" fill="url(#star)"/>
  <circle cx="42" cy="21" r="4" fill="url(#star)"/>
  <circle cx="37" cy="42" r="4.5" fill="url(#star)"/>
  <circle cx="24" cy="40" r="3.5" fill="url(#star)"/>
  <!-- flare streak on the bright star -->
  <rect x="21" y="29.5" width="20" height="1" rx="0.5" fill="#dce8ff" opacity="0.8"/>
  <!-- comet on the rim -->
  <path d="M58 32 A26 26 0 0 0 50 13" fill="none" stroke="#cfe0ff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <circle cx="58" cy="32" r="2.5" fill="#fff"/>
</svg>
